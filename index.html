<script>
  const MAX = 4;

  const startScreen = document.getElementById("start-screen");
  const enterBtn = document.getElementById("enter-btn");
  const sceneEl = document.getElementById("ar-scene");

  function setupVideosWithSound() {
    for (let i = 0; i <= MAX; i++) {
      const v = document.getElementById("video" + i);
      if (!v) continue;
      v.muted = false;          // 開聲
      v.removeAttribute("muted");
      v.volume = 1.0;
      // 喺「用戶撳掣」同一時間解鎖音訊
      v.play().then(function () {
        v.pause();
        v.currentTime = 0;
      }).catch(function () {});
    }
  }

  function playForTarget(index) {
    const v = document.getElementById("video" + index);
    if (!v) return;
    v.muted = false;
    v.volume = 1.0;
    v.currentTime = 0;
    const p = v.play();
    if (p && p.catch) p.catch(function () {});
  }

  function pauseForTarget(index) {
    const v = document.getElementById("video" + index);
    if (!v) return;
    v.pause();
  }

  enterBtn.addEventListener("click", function () {
    setupVideosWithSound();   // 靠呢下 click 解鎖有聲
    startScreen.style.display = "none";
    sceneEl.style.display = "block";
    sceneEl.play();

    for (let i = 0; i <= MAX; i++) {
      const target = document.querySelector('[mindar-image-target="targetIndex: ' + i + '"]');
      if (!target) continue;
      target.addEventListener("targetFound", function () { playForTarget(i); });
      target.addEventListener("targetLost", function () { pauseForTarget(i); });
    }
  });
</script>
