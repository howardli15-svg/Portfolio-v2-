<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>希晨 的 AR 展覽館</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
        #start-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background-image: url('./bg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: white;
            display: flex; flex-direction: column; align-items: center;
            justify-content: flex-start; padding-top: 15%;
            z-index: 9999; font-family: sans-serif;
        }
        #start-overlay::before {
            content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.3); z-index: -1;
        }
        #start-button {
            padding: 18px 45px; font-size: 20px; background-color: #f1c40f;
            color: #2c3e50; border: none; border-radius: 50px; cursor: pointer;
            font-weight: bold; box-shadow: 0 6px 15px rgba(0,0,0,0.3); margin-top: 20px;
        }
        .title-text {
            font-size: 28px; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            text-align: center; line-height: 1.4;
        }
    </style>
</head>
<body>

    <div id="start-overlay">
        <div class="title-text">希晨 的成長時刻<br>AR 互動展覽館</div>
        <button id="start-button">進入體驗</button>
    </div>

    <a-scene mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 1;" renderer="colorManagement: true" vr-mode-ui="enabled: false">

        <a-assets>
            <video id="video0" src="./video0.mp4" preload="auto" loop="true" playsinline webkit-playsinline crossorigin="anonymous"></video>
            <video id="video1" src="./video1.mp4" preload="auto" loop="true" playsinline webkit-playsinline crossorigin="anonymous"></video>
            <video id="video2" src="./video2.mp4" preload="auto" loop="true" playsinline webkit-playsinline crossorigin="anonymous"></video>
            <video id="video3" src="./video3.mp4" preload="auto" loop="true" playsinline webkit-playsinline crossorigin="anonymous"></video>
            <video id="video4" src="./video4.mp4" preload="auto" loop="true" playsinline webkit-playsinline crossorigin="anonymous"></video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0"><a-entity class="ar-plane" geometry="primitive: plane; width: 1; height: 1.777" scale="1.05 1.05 1" position="0 0 0"></a-entity></a-entity>
        <a-entity mindar-image-target="targetIndex: 1"><a-entity class="ar-plane" geometry="primitive: plane; width: 1; height: 1.777" scale="1.05 1.05 1" position="0 0 0"></a-entity></a-entity>
        <a-entity mindar-image-target="targetIndex: 2"><a-entity class="ar-plane" geometry="primitive: plane; width: 1; height: 1.777" scale="1.05 1.05 1" position="0 0 0"></a-entity></a-entity>
        <a-entity mindar-image-target="targetIndex: 3"><a-entity class="ar-plane" geometry="primitive: plane; width: 1; height: 1.777" scale="1.05 1.05 1" position="0 0 0"></a-entity></a-entity>
        <a-entity mindar-image-target="targetIndex: 4"><a-entity class="ar-plane" geometry="primitive: plane; width: 1; height: 1.777" scale="1.05 1.05 1" position="0 0 0"></a-entity></a-entity>
    </a-scene>

    <script>
        const startButton = document.querySelector('#start-button');
        const startOverlay = document.querySelector('#start-overlay');
        const planes = document.querySelectorAll('.ar-plane');
        const mutedIndexes = [];
        const MAX = 4;
        const lostTimers = {};
        const hasMaterial = {};

        function stopAllExcept(keepIndex) {
            for (let i = 0; i <= MAX; i++) {
                if (i === keepIndex) continue;
                const v = document.querySelector('#video' + i);
                if (v) v.pause();
                if (planes[i]) planes[i].removeAttribute('material');
                hasMaterial[i] = false;
                if (lostTimers[i]) {
                    clearTimeout(lostTimers[i]);
                    lostTimers[i] = null;
                }
            }
        }

        startButton.addEventListener('click', () => {
            startOverlay.style.display = 'none';
            for (let i = 0; i <= MAX; i++) {
                const v = document.querySelector('#video' + i);
                if (!v) continue;
                v.muted = mutedIndexes.includes(i);
                v.play().then(() => { v.pause(); }).catch(() => {});
            }
        });

        document.querySelectorAll('[mindar-image-target]').forEach((target, index) => {
            const currentVideo = document.querySelector('#video' + index);

            target.addEventListener('targetFound', () => {
                // 手震短暫 lost 又 found：取消暫停
                if (lostTimers[index]) {
                    clearTimeout(lostTimers[index]);
                    lostTimers[index] = null;
                }

                stopAllExcept(index);

                // 只 set 一次 material，避免狂重置
                if (!hasMaterial[index]) {
                    planes[index].setAttribute(
                        'material',
                        'src: #video' + index + '; shader: flat; transparent: true'
                    );
                    hasMaterial[index] = true;
                }

                // 認到緊：只繼續播，唔 currentTime = 0
                if (currentVideo.paused) {
                    const p = currentVideo.play();
                    if (p && p.catch) p.catch(() => {});
                }
            });

            target.addEventListener('targetLost', () => {
                // 延遲先停，避免播幾秒就斷
                lostTimers[index] = setTimeout(() => {
                    currentVideo.pause();
                    planes[index].removeAttribute('material');
                    hasMaterial[index] = false;
                    lostTimers[index] = null;
                }, 500);
            });
        });
    </script>
</body>
</html>
